name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']
    env:
      GOTOOLCHAIN: local
      ADANOS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Set test receipt directory
        run: echo "ADANOS_TEST_ARTIFACT_DIR=$RUNNER_TEMP/adanos-test-receipts-${{ matrix.go }}" >> "$GITHUB_ENV"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Regenerate models
        run: |
          go generate ./...
          git diff --exit-code -- models.gen.go
      - name: Vet
        run: go vet ./...
      - name: Test
        run: |
          mkdir -p "$ADANOS_TEST_ARTIFACT_DIR"
          go test -json -count=1 ./... | tee "$ADANOS_TEST_ARTIFACT_DIR/test.jsonl"
      - name: Race detector
        run: go test -race -count=1 ./... | tee "$ADANOS_TEST_ARTIFACT_DIR/race.txt"
      - name: Upload test receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-receipts-go-${{ matrix.go }}
          path: ${{ env.ADANOS_TEST_ARTIFACT_DIR }}
          if-no-files-found: ignore
